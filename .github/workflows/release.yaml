name: Release

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      NEXT_PUBLIC_ENVIRONMENT: ${{ vars.NEXT_PUBLIC_ENVIRONMENT }}
      NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
      NEXT_PUBLIC_BASE_API_URL: ${{ vars.NEXT_PUBLIC_BASE_API_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup
        uses: commencis/js-toolkit/.github/actions/setup@main

      - name: Typegen
        run: pnpm run typegen

      - name: Lint
        run: pnpm run lint

      - name: Build
        run: pnpm run build

      - name: Create Release Pull Request
        uses: changesets/action@v2.1.2
        with:
          pr-title: 'ci(release): create new release'
          commit-message: 'ci(release): create new release'
          version-script: pnpm run changeset:version
          publish-script: npx @changesets/cli git-tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
